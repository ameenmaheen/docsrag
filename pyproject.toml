[project]
name = "docsrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ameen", email = "ameenmaheen@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
docsrag = "docsrag:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
